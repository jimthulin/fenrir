name: fenrir-weekly
on:
  schedule:
    - cron: "0 6 * * 6"        # Saturdays 06:00 UTC (08:00 CET) — after all markets closed
  workflow_dispatch: {}         # manual run button
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas numpy
      - run: python fenrir_update.py
      - name: commit
        run: |
          git config user.name fenrir-bot
          git config user.email fenrir@users.noreply.github.com
          git add data.json index.html dispatch.txt
          git diff --cached --quiet || git commit -m "weekly update $(date -u +%F)"
          git push
      - name: email dispatch (optional — set the four SMTP secrets to enable)
        if: ${{ env.MAIL_ON == 'true' }}
        env:
          MAIL_ON: ${{ secrets.MAIL_USERNAME != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "FENRIR dispatch — week ending $(date -u +%F)"
          to: ${{ secrets.MAIL_TO }}
          from: Fenrir Console
          body: file://dispatch.txt
          attachments: index.html
